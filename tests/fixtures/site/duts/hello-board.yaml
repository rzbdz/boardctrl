# A K1 board whose console and flash come from a site provider, not from hardware drivers:
# tests/fixtures/site/providers/hello-platform. The board and SoC facts are the public ones from
# platforms/spacemit (SpacemiT K1 / Banana Pi BPI-F3); what is faked is only the two roles the plugin
# answers, which is where a real adapter puts its own tool's calls.
#
#   BOARDCTRL_SITE=tests/fixtures/site bin/boardctrld -c tests/fixtures/site/hosts/hello.yaml
id: hello-board
host: hello
board: spacemit-k1x-deb1
soc: k1
description: a K1 board served by the hello-platform example plugin
services:
  console: {provider: hello-console, greeting: "hello"}
  flash:   {provider: hello-flash, expect_version: "V1.2"}
  relay:    {provider: human}          # no GPIO wired: a person presses reset
  download: {provider: none}
  debug:    {provider: none}
