[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boardctrl"
version = "0.1.0b0"
description = "A board host: two pins in, a leased board out — one CLI and HTTP API for embedded BSP developers and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["embedded", "bsp", "linux-kernel", "u-boot", "fastboot", "hardware-in-the-loop", "board-farm", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
]
# The board-host daemon needs Python >= 3.10. The client also runs from a clone
# (bin/boardctrl) on Python >= 3.8; host commands are stdlib-only, SDK and site commands
# need PyYAML.
dependencies = ["pyyaml>=5.1"]

[project.urls]
Homepage = "https://github.com/rzbdz/boardctrl"
Issues = "https://github.com/rzbdz/boardctrl/issues"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
gpiod = ["gpiod>=2.1"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
boardctrl = "frontends.cli.main:cli"
boardctrld = "frontends.server.__main__:main"
# The names before boardctrl; kept working for scripts, units and sites written then.
bsp = "frontends.cli.main:cli"
bsp-hostd = "frontends.server.__main__:main"

# Three top-level packages, flat in the repository: the kernel, the modules, the frontends.
# Every module is `modules/<name>/` with a `module.py`; a site carries more of the same under
# `<site>/modules/<name>/`, and the host loads both the same way.
[tool.setuptools]
packages = ["core", "modules", "modules.gpio", "modules.gpio.backends", "modules.dut",
            "modules.sdk", "modules.registry", "frontends", "frontends.cli", "frontends.server"]

[tool.setuptools.package-data]
"frontends.server" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
