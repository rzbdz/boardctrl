# A K1 board whose console and flash come from a site plugin, not from hardware drivers:
# examples/site/modules/hello-platform. The board and SoC facts are the public ones from
# profiles/spacemit (SpacemiT K1 / Banana Pi BPI-F3); what is faked is only the two roles the plugin
# answers, which is where a real adapter puts its own tool's calls.
#
#   BSP_SITE=examples/site boardctrld -c examples/site/hosts/hello.yaml
id: hello-board
host: hello
board: spacemit-bananapi-f3
soc: k1
description: a K1 board served by the hello-platform example plugin
services:
  console: {provider: hello-console, greeting: "hello"}
  flash:   {provider: hello-flash, expect_version: "V1.2"}
  relay:    {provider: human}          # no GPIO wired: a person presses reset
  download: {provider: none}
  debug:    {provider: none}
