# A board whose console and flash come from a site plugin: examples/site/modules/hello-platform.
# Load it on the hello host:  BSP_SITE=examples/site boardctrld -c examples/site/hosts/hello.yaml
id: hello-board
host: hello
description: a made-up board served entirely by the hello-platform plugin
services:
  console: {provider: hello-console, greeting: "hello"}
  flash:   {provider: hello-flash, expect_version: "V1.2"}
  relay:    {provider: human}
  download: {provider: none}
  debug:    {provider: none}
