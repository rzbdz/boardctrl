# A host that carries one site plugin and nothing else hardware-specific: the smallest complete
# example of "a platform adapter is a directory of code, loaded by name".
#   BSP_SITE=examples/site boardctrld -c examples/site/hosts/hello.yaml
host: {id: hello, description: example host with the hello-platform site plugin}
server: {bind: 127.0.0.1, port: 8770, state_dir: ../../../var/hello}
modules:
  dut: {}
  hello-platform: {}       # the plugin in modules/hello-platform; a name here selects it
