# Board profile: Banana Pi BPI-F3 (SpacemiT K1, 26-pin expansion header)
#
# Public board documentation: the BPI-F3 carries a SpacemiT K1 (8-core RISC-V) and breaks its 40-pin
# connector out as a 26-pin expansion header on the common revision. GPIO pins use the Linux GPIO
# number exported by the k1x pinctrl driver (base 0); the pinmux inspector maps pinctrl pin numbers
# to GPIO numbers through debugfs gpio-ranges, since on K1 they are not the same number.
#
# Where the public pinout does not state a GPIO number, the pin is modelled as `other` (documented,
# not drivable): change it to `{gpio: N}` once the number is confirmed on the board.
id: spacemit-bananapi-f3
name: Banana Pi BPI-F3
description: Banana Pi BPI-F3, SpacemiT K1, 26-pin expansion header (3.3 V I/O).

headers:
  - id: J26
    title: 26-pin expansion header
    layout: dual-row
    pin_count: 26
    pins:
      1:  {kind: power, label: 3.3V}
      2:  {kind: power, label: 5V}
      3:  {kind: other, label: I2C5_SDA}
      4:  {kind: power, label: 5V}
      5:  {kind: other, label: I2C5_SCL}
      6:  {kind: gnd, label: GND}
      7:  {kind: other, label: GPIO_7}          # GPIO 71 on the schematic, not confirmed in Linux
      8:  {kind: other, label: UART0_TXD}
      9:  {kind: gnd, label: GND}
      10: {kind: other, label: UART0_RXD}
      11: {kind: other, label: GPIO_11}
      12: {kind: other, label: GPIO_12}
      13: {kind: other, label: GPIO_13}
      14: {kind: gnd, label: GND}
      15: {kind: other, label: GPIO_15}
      16: {kind: other, label: GPIO_16}
      17: {kind: power, label: 3.3V}
      18: {kind: other, label: GPIO_18}
      19: {kind: other, label: SPI_CS}
      20: {kind: gnd, label: GND}
      21: {kind: other, label: SPI_MISO}
      22: {kind: other, label: SPI_CLK}
      23: {kind: other, label: SPI_MOSI}
      24: {kind: gnd, label: GND}
      25: {kind: gnd, label: GND}
      26: {kind: other, label: GPIO_26}

gpio:
  numbering: global
  bank_size: 32

# Pin-mux inspection via debugfs. As on the Com260, read only pinmux-pins and gpio-ranges: reading
# pinconf-pins on this SoC's pinctrl driver has the same hazard described in the Com260 profile.
pinctrl:
  debugfs: /sys/kernel/debug/pinctrl/d401e000.pinctrl
